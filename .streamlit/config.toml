# Tema baseado no protótipo do Figma: barra lateral roxa, fundo cinza-azulado
# e cards brancos. O app usa sempre o tema claro para ficar igual ao protótipo.

[client]
toolbarMode = "minimal"

[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
baseFontSize = 15
headingFontWeights = [700, 700, 600, 600, 600, 600]
headingFontSizes = ["28px", "20px", "17px", "15px", "14px", "13px"]
baseRadius = "8px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false

primaryColor = "#2563EB"
backgroundColor = "#EEF2F7"
secondaryBackgroundColor = "#F3F6FA"
textColor = "#1F2937"
borderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F3F6FA"
blueColor = "#2563EB"
greenColor = "#16A34A"
yellowColor = "#CA8A04"
orangeColor = "#D97706"
redColor = "#DC2626"
violetColor = "#7C3AED"
grayColor = "#64748B"

[theme.sidebar]
backgroundColor = "#5B2380"
secondaryBackgroundColor = "#6E3396"
textColor = "#FFFFFF"
borderColor = "#6E3396"
primaryColor = "#FFFFFF"
